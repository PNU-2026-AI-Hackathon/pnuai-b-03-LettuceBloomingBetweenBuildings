<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>미니팜 회원가입</title>
</head>
<body>
<h1>📝 미니팜 회원가입</h1>
<hr/>

<form action="/api/join" method="POST">
    <input type="text" name="username" placeholder="사용자 아이디 (예: b03_user)" required> <br/>
    <input type="password" name="password" placeholder="비밀번호" required> <br/>
    <input type="email" name="email" placeholder="이메일 (예: test@pusan.ac.kr)" required> <br/>
    <button type="submit">회원가입 완료</button>
</form>
</body>
</html>
