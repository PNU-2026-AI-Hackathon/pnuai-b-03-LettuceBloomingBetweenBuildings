<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>B03 미니팜 메인</title>
</head>
<body>
<h1>🥬 미니팜에 오신 것을 환영합니다</h1>
<hr/>

<!-- 비로그인 상태일 때 보임 -->
<div sec:authorize="isAnonymous()">
    <p>서비스를 이용하려면 로그인이 필요합니다.</p>
    <a href="/loginForm">로그인 하러 가기</a> <br/>
    <a href="/joinForm">회원가입 하러 가기</a>
</div>

<!-- 로그인 상태일 때 보임 -->
<div sec:authorize="isAuthenticated()">
    <p>🎉 로그인 성공!</p>
    <p>반갑습니다, <span sec:authentication="name">사용자</span>님!</p>
    <p>권한: <span sec:authentication="principal.authorities">권한</span></p>

    <ul>
        <li><a href="/user">일반 유저 페이지 테스트 (/user)</a></li>
        <li><a href="/manager">매니저 페이지 테스트 (/manager)</a></li>
        <li><a href="/admin">어드민 페이지 테스트 (/admin)</a></li>
    </ul>
    <br/>
    <a href="/logout">로그아웃</a>
</div>
</body>
</html>
